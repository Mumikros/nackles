<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111b2b"/><stop offset="1" stop-color="#090c13"/></linearGradient></defs><rect width="1200" height="530" rx="24" fill="url(#bg)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="52" y="48" fill="#7df3e1" font-size="13" font-weight="600">AJANININ DURUMUNU GÖR</text><text x="52" y="105" fill="#f1f5fb" font-size="35" font-weight="700">“Bitti mi?” diye pencere değiştirmeyi bırak.</text><text x="52" y="143" fill="#abb8cb" font-size="19" font-weight="400">Claude Code ve Codex etkinliğini ekranının üstünden takip et.</text><rect x="52" y="200" width="350" height="196" rx="18" fill="#131d2c"/><circle cx="81" cy="237" r="6" fill="#6c8cff"/><text x="100" y="243" fill="#abb8cb" font-size="15" font-weight="400">Claude Code · Codex</text><text x="76" y="297" fill="#6c8cff" font-size="29" font-weight="700">Çalışıyor</text><text x="76" y="342" fill="#abb8cb" font-size="17" font-weight="400">Ajanın işine devam ediyor.</text><rect x="425" y="200" width="350" height="196" rx="18" fill="#131d2c"/><circle cx="454" cy="237" r="6" fill="#ffd050"/><text x="473" y="243" fill="#abb8cb" font-size="15" font-weight="400">Claude Code · Codex</text><text x="449" y="297" fill="#ffd050" font-size="29" font-weight="700">Seni bekliyor</text><text x="449" y="342" fill="#abb8cb" font-size="17" font-weight="400">İzin isteğini fark et.</text><rect x="798" y="200" width="350" height="196" rx="18" fill="#131d2c"/><circle cx="827" cy="237" r="6" fill="#4fdb7d"/><text x="846" y="243" fill="#abb8cb" font-size="15" font-weight="400">Claude Code · Codex</text><text x="822" y="297" fill="#4fdb7d" font-size="29" font-weight="700">İş bitti</text><text x="822" y="342" fill="#abb8cb" font-size="17" font-weight="400">Sonucu kontrol etmeye dön.</text><text x="52" y="444" fill="#abb8cb" font-size="17" font-weight="400">Desteklenen Claude Code izinlerini adadan yanıtla. Codex izinleri kendi penceresinde yanıtlanır.</text><text x="52" y="499" fill="#788ba7" font-size="13" font-weight="400">NACKLES  /  Özellik tanıtım çizimi · Örnek içerik</text></g></svg>